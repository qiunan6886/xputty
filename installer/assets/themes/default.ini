; xPuTTY default terminal theme (shipped with the installer).
; Read by the modified putty.exe via: -xputty-theme <path-to-this-file>
; The shell also regenerates themes\current.ini from the user's settings at
; runtime; this file provides a correct out-of-the-box default.
;
; Format (see putty\windows\xputty.c, xputty_apply_theme):
;   [terminal] font / font-size / scrollback / cursor / bell
;   [colors]   foreground / background / cursor / ansi0..ansi15 (#RRGGBB)
; Unknown keys and [sections] are ignored.

[terminal]
font=Cascadia Mono
font-size=11
scrollback=5000
cursor=block
bell=off

[colors]
foreground=#E6EAF2
foreground-bold=#FFFFFF
background=#0F1115
background-bold=#161A22
cursor-text=#0F1115
cursor=#4C8DFF
ansi0=#161A22
ansi1=#E06C75
ansi2=#98C379
ansi3=#E5C07B
ansi4=#61AFEF
ansi5=#C678DD
ansi6=#56B6C2
ansi7=#ABB2BF
ansi8=#5C6370
ansi9=#FF7B86
ansi10=#B5E48C
ansi11=#FFD68A
ansi12=#82C7FF
ansi13=#E29BF0
ansi14=#7FD8E4
ansi15=#FFFFFF
